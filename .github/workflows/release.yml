name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (x.y.z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download SDL3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18-win32-x64.zip" -OutFile SDL3.zip
          Expand-Archive -Path SDL3.zip -DestinationPath C:\
          Rename-Item "C:\SDL3-3.4.18" "C:\SDL3"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSDL3_DIR=C:/SDL3/cmake/SDL3

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          mkdir package
          copy build\calculator.exe package\
          xcopy assets package\assets\ /E /I /Y
          copy README.md package\
          copy C:\SDL3\SDL3.dll package\
          Compress-Archive -Path package\* -DestinationPath "wardogs-calculator-v${{ inputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-calculator-v${{ inputs.version }}
          path: "wardogs-calculator-v${{ inputs.version }}.zip"

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wardogs-calculator-v${{ inputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: >
          gh release create "v${VERSION}"
          "wardogs-calculator-v${VERSION}.zip"
          --repo "${{ github.repository }}"
          --title "v${VERSION}"
          --notes "WARDOGS Artillery Calculator v${VERSION}"
          --draft=false
          --latest